name: Rails CI/CD Pipeline

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- JOB 1: LINTER ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  # --- JOB 2: TESTS ---
  test:
    runs-on: ubuntu-latest
    needs: lint # Only run tests if linting passes
    services:
      postgres:
        image: postgres:11-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://postgres:password@localhost:5432/rails_test"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build Database
        run: bin/rails db:test:prepare
      - name: Run RSpec
        run: bundle exec rspec

  # --- JOB 3: DEPLOY TO STAGING ---
  deploy:
    runs-on: ubuntu-latest
    needs: test # Only deploy if tests pass
    if: github.ref == 'refs/heads/staging' # Only deploy when pushing to the staging branch
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to Staging
        run: |
          echo "Triggering deployment to staging server..."
          # Example for Kamal deployment:
          # gem install kamal && kamal deploy -e staging
          
          # Example for Heroku:
          # git push https://heroku:$HEROKU_API_KEY@git.heroku.com/your-staging-app.git staging:master